<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>飞秋 - 局域网即时文本传输</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Lucide Icons (CDN) for clean modern UI icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <!-- Ambient background blobs -->
  <div class="bg-glow blob-1"></div>
  <div class="bg-glow blob-2"></div>

  <div class="app-container">
    <header class="app-header">
      <div class="logo-area">
        <i data-lucide="zap" class="logo-icon"></i>
        <h1>飞秋</h1>
      </div>
      <div class="status-container">
        <span class="status-indicator disconnected" id="connection-status">
          <span class="dot"></span>
          <span class="status-text">未连接</span>
        </span>
        <div class="header-actions">
          <button class="icon-btn desktop-only-btn subtle" title="界面设置">
            <i data-lucide="settings-2"></i>
          </button>
          <button id="mobile-clear-btn" class="btn text-btn mobile-only-btn" title="清空记录">
            <i data-lucide="trash-2"></i>
            <span>清空</span>
          </button>
          <button id="mobile-info-btn" class="btn secondary mobile-only-btn" title="扫码与房间信息">
            <i data-lucide="qr-code"></i>
            <span>二维码</span>
          </button>
        </div>
      </div>
    </header>

    <div class="main-layout">
      <aside class="nav-rail card device-panel">
        <div class="section-title panel-title">
          <i data-lucide="shield"></i>
          <h2>设备管理</h2>
        </div>

        <section class="moderation-panel nav-moderation-panel">
          <div class="moderation-summary">
            <span class="role-badge" id="room-role-badge">普通成员</span>
            <p id="room-role-hint" hidden></p>
          </div>

          <div class="moderation-group">
            <div class="moderation-group-title">当前成员</div>
            <div id="room-members-list" class="member-list">
              <div class="member-empty">等待成员加入...</div>
            </div>
          </div>

          <div class="moderation-group">
            <div class="moderation-group-title">屏蔽名单</div>
            <div id="blocked-members-list" class="member-list">
              <div class="member-empty">暂无屏蔽成员</div>
            </div>
          </div>
        </section>
      </aside>

      <aside class="sidebar card">
        <div class="sidebar-mobile-header mobile-only-btn">
          <div class="sidebar-mobile-title">
            <i data-lucide="qr-code"></i>
            <span>连接信息与管理</span>
          </div>
          <button id="close-sidebar-btn" class="icon-btn" title="关闭">
            <i data-lucide="x"></i>
          </button>
        </div>

        <section class="info-card hero-card">
          <div class="section-title compact">
            <h2>连接信息</h2>
          </div>

          <div class="identity-row">
            <div class="identity-main">
              <div class="identity-icon">
                <i data-lucide="monitor"></i>
              </div>
              <div>
                <div class="identity-title"><span id="my-peer-id-display">获取中...</span> <span class="identity-note">(本机)</span></div>
                <div class="identity-ip-line">
                  <span id="local-ip-display">-</span>
                </div>
              </div>
            </div>
            <div class="online-pill">
              <span class="dot"></span>
              <span>在线</span>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-item">
              <div class="stat-value" id="peer-count">0 个设备</div>
              <div class="stat-label">已连接设备</div>
            </div>
            <div class="stat-item">
              <div class="stat-value code-font" id="room-id-display">default</div>
              <div class="stat-label">当前房间</div>
            </div>
          </div>
        </section>

        <section class="info-card nearby-card">
          <div class="section-title compact">
            <h2>快速连接</h2>
          </div>

          <div class="qr-container">
            <img id="qr-code-img" src="" alt="连接二维码" style="display: none;">
            <div id="qr-placeholder" class="qr-placeholder">
              <div class="spinner"></div>
              <span>生成二维码中...</span>
            </div>
          </div>

          <div class="link-copier">
            <label for="lan-url">局域网访问地址</label>
            <div class="input-group">
              <input type="text" id="lan-url" readonly value="获取中...">
              <button id="copy-url-btn" class="icon-btn" title="复制链接">
                <i data-lucide="copy"></i>
              </button>
            </div>
          </div>
        </section>

        <div class="room-actions">
          <button id="new-room-btn" class="btn secondary">
            <i data-lucide="plus-circle"></i>
            新建独立房间
          </button>
        </div>
      </aside>

      <main class="chat-panel card">
        <div class="chat-header">
          <div class="chat-heading-group">
            <div class="chat-title">
              <i data-lucide="message-square-quote"></i>
              <h2>局域网文本与文件白板</h2>
            </div>
          </div>
          <div class="chat-actions">
            <button id="clear-chat-btn" class="btn text-btn" title="清空记录">
              <i data-lucide="trash-2"></i>
              <span>清空</span>
            </button>
          </div>
        </div>

        <div class="messages-container" id="messages-list">
          <div class="system-message">
            <p>等待其他设备加入... 打开左侧链接或二维码以建立 WebRTC 连接。</p>
          </div>
        </div>

        <div class="input-panel">
          <div class="input-wrapper">
            <button id="attach-btn" class="icon-btn input-attach-btn" title="选择文件">
              <i data-lucide="paperclip"></i>
            </button>
            <textarea id="text-input" placeholder="输入消息或拖拽文件到这里..." rows="3"></textarea>
          </div>
          <div class="input-controls">
            <div class="input-meta-group">
              <input type="file" id="file-input" style="display: none;">
              <div class="char-count" id="char-count">0 字符</div>
              <div class="desktop-input-hint">Shift + Enter 换行</div>
            </div>
            <button id="send-btn" class="btn primary" disabled>
              <i data-lucide="send-horizontal"></i>
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="toast">
    <i data-lucide="info" id="toast-icon"></i>
    <span id="toast-message">提示内容</span>
  </div>

  <!-- Socket.io library -->
  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="app/main.js"></script>
  <script>
    // Initialize Lucide Icons after the DOM has loaded
    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
